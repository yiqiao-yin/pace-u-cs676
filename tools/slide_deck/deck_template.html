<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 676 — Algorithms of Data Science</title>
<style>
  :root{
    --bg:#000; --panel:#08080a; --line:#1c1c21; --fg:#fff;
    --dim:#8e8e97; --accent:#7cc4ff; --dot:#2c2c33;
    --sidebar:310px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- layout ---------- */
  #app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100%}
  #app.collapsed{grid-template-columns:0 1fr}
  #app.present{grid-template-columns:0 1fr}

  /* ---------- sidebar ---------- */
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
    overflow:hidden;transition:opacity .15s}
  #app.collapsed aside,#app.present aside{opacity:0;pointer-events:none}
  .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:.95rem;letter-spacing:-.01em}
  .brand p{margin:3px 0 0;font-size:.72rem;color:var(--dim)}
  .search{padding:10px 14px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:7px 10px;border-radius:7px;border:1px solid #26262b;
    background:#0f0f13;color:var(--fg);font-size:.82rem;outline:none}
  .search input:focus{border-color:var(--accent)}
  nav{overflow-y:auto;flex:1;padding:6px 0 24px}
  .chap{border-bottom:1px solid #131317}
  .chap>button{width:100%;display:flex;gap:9px;align-items:baseline;padding:9px 16px;text-align:left}
  .chap>button:hover{background:#101014}
  .chap.active>button{background:#14141a}
  .cnum{font-size:.66rem;color:var(--accent);min-width:16px;font-variant-numeric:tabular-nums}
  .cname{font-size:.82rem;flex:1}
  .ccount{font-size:.66rem;color:var(--dim)}
  .slides{display:none;padding-bottom:5px}
  .chap.open .slides{display:block}
  .slides button{display:flex;gap:9px;width:100%;text-align:left;padding:5px 16px 5px 41px;
    font-size:.75rem;color:var(--dim);line-height:1.35}
  .slides button:hover{background:#101014;color:var(--fg)}
  .slides button.cur{color:var(--accent);background:#12121a}
  .snum{font-variant-numeric:tabular-nums;opacity:.55;min-width:26px}
  .stitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- main ---------- */
  main{display:flex;flex-direction:column;min-width:0;position:relative}

  /* dots progress bar */
  #dots{display:flex;gap:6px;padding:12px 18px 9px;align-items:center;border-bottom:1px solid var(--line)}
  .grp{display:flex;gap:1.5px;flex:var(--w) 1 0;min-width:0}
  .dot{flex:1 1 0;min-width:1px;height:7px;border-radius:2px;background:var(--dot);
    cursor:pointer;transition:background .12s,transform .12s}
  .dot:hover{transform:scaleY(1.9);background:#4a4a55}
  .dot.seen{background:#3d5a70}
  .dot.cur{background:var(--accent);transform:scaleY(2.1)}

  /* top bar */
  #bar{display:flex;align-items:center;gap:14px;padding:7px 18px;border-bottom:1px solid var(--line);
    font-size:.75rem;color:var(--dim)}
  #bar .sep{flex:1}
  #bar button{padding:3px 9px;border:1px solid #26262b;border-radius:6px;font-size:.72rem;color:var(--dim)}
  #bar button:hover{border-color:var(--accent);color:var(--accent)}
  #bar button.on{border-color:var(--accent);color:var(--accent);background:#0e1a24}
  #chapnow{color:var(--fg)}
  #count{font-variant-numeric:tabular-nums;color:var(--fg)}

  /* stage */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden;position:relative}
  #slide{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
    box-shadow:0 12px 44px rgba(0,0,0,.75);background:#fff}
  /* Slides are white-on-black artwork in the source PDF. This inverts them to sit on the
     dark shell; hue-rotate keeps colour figures approximately true. */
  #app.invert #slide{filter:invert(1) hue-rotate(180deg);background:#000}
  #app.present #stage{padding:0}
  #app.present #slide{border-radius:0;max-height:100vh}

  .nav{position:absolute;top:0;bottom:0;width:16%;border:0;opacity:0;cursor:pointer}
  .nav:hover{opacity:1;background:linear-gradient(var(--dir),rgba(124,196,255,.12),transparent)}
  #prev{left:0;--dir:to right}
  #next{right:0;--dir:to left}

  /* notes */
  #notes{border-top:1px solid var(--line);padding:11px 20px;font-size:.78rem;line-height:1.55;
    color:#b6b6bd;max-height:24vh;overflow-y:auto;background:#050506}
  #notes:empty,#app.present #notes{display:none}

  /* search results */
  #results{position:absolute;inset:0;background:rgba(0,0,0,.96);z-index:20;overflow-y:auto;padding:26px 30px;display:none}
  #results.show{display:block}
  #results h2{margin:0 0 14px;font-size:.85rem;color:var(--dim);font-weight:600}
  .hit{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:8px;background:#0a0a0c}
  .hit:hover{border-color:var(--accent)}
  .hit b{color:var(--accent);font-weight:600}
  .hit .hn{font-size:.68rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .hit .ht{font-size:.82rem;margin:2px 0 4px}
  .hit .hx{font-size:.73rem;color:var(--dim);line-height:1.45}

  #help{position:absolute;bottom:14px;right:18px;font-size:.68rem;color:#55555e;pointer-events:none}
  #app.present #help{display:none}
  @media (max-width:820px){:root{--sidebar:0px}}
</style>
</head>
<body>
<div id="app" class="invert">
  <aside>
    <div class="brand">
      <h1>CS 676 — Algorithms of Data Science</h1>
      <p>Pace University · <span id="total"></span> slides</p>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search all slides…  ( / )" autocomplete="off"></div>
    <nav id="toc"></nav>
  </aside>

  <main>
    <div id="dots"></div>
    <div id="bar">
      <button id="menu" title="Toggle sidebar">☰</button>
      <span id="chapnow"></span>
      <span class="sep"></span>
      <span id="count"></span>
      <button id="inv" class="on" title="Invert slide colours">invert</button>
      <button id="pres" title="Present (f)">present</button>
    </div>
    <div id="stage">
      <button id="prev" class="nav" aria-label="Previous"></button>
      <img id="slide" alt="">
      <button id="next" class="nav" aria-label="Next"></button>
      <div id="help">← → navigate · j/k · f present · / search · esc exit</div>
    </div>
    <div id="notes"></div>
    <div id="results"></div>
  </main>
</div>

<script>
const DATA = /*__PAYLOAD__*/;
const S = DATA.slides, CH = DATA.chapters;
const app=document.getElementById('app'), img=document.getElementById('slide');
const $=id=>document.getElementById(id);
let cur=0, seen=new Set();

/* ---------- build the dot strip: one dot per slide, grouped by chapter ---------- */
const dotEls=[];
{
  const counts=CH.map((_,i)=>S.filter(s=>s.c===i).length);
  CH.forEach((c,ci)=>{
    const g=document.createElement('div');
    g.className='grp'; g.style.setProperty('--w',counts[ci]);
    g.title=`${ci+1}. ${c.name}`;
    S.forEach((s,i)=>{ if(s.c!==ci) return;
      const d=document.createElement('button');
      d.className='dot'; d.title=`${s.n}. ${s.t}`;
      d.onclick=()=>go(i); g.appendChild(d); dotEls[i]=d;
    });
    $('dots').appendChild(g);
  });
}

/* ---------- table of contents ---------- */
CH.forEach((c,ci)=>{
  const wrap=document.createElement('div'); wrap.className='chap'; wrap.dataset.c=ci;
  const head=document.createElement('button');
  const n=S.filter(s=>s.c===ci).length;
  head.innerHTML=`<span class="cnum">${String(ci+1).padStart(2,'0')}</span>
    <span class="cname">${c.name}</span><span class="ccount">${n}</span>`;
  head.onclick=()=>{ wrap.classList.toggle('open');
    if(wrap.classList.contains('open')) go(S.findIndex(s=>s.c===ci)); };
  wrap.appendChild(head);
  const list=document.createElement('div'); list.className='slides';
  S.forEach((s,i)=>{ if(s.c!==ci) return;
    const b=document.createElement('button'); b.dataset.i=i;
    b.innerHTML=`<span class="snum">${s.n}</span><span class="stitle">${esc(s.t)}</span>`;
    b.onclick=()=>go(i); list.appendChild(b);
  });
  wrap.appendChild(list); $('toc').appendChild(wrap);
});

function esc(t){return t.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* ---------- navigation ---------- */
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i)); const s=S[cur];
  img.src='data:image/webp;base64,'+s.img;
  img.alt=`Slide ${s.n}: ${s.t}`;
  seen.add(cur);
  dotEls.forEach((d,k)=>{ d.classList.toggle('cur',k===cur); d.classList.toggle('seen',k!==cur&&seen.has(k)); });
  $('count').textContent=`${s.n} / ${S.length}`;
  $('chapnow').textContent=`${String(s.c+1).padStart(2,'0')} · ${CH[s.c].name}`;
  $('notes').textContent=s.x||'';
  document.querySelectorAll('.chap').forEach(w=>{
    const on=+w.dataset.c===s.c; w.classList.toggle('active',on); if(on) w.classList.add('open');
  });
  document.querySelectorAll('.slides button').forEach(b=>b.classList.remove('cur'));
  const act=document.querySelector(`.slides button[data-i="${cur}"]`);
  if(act){act.classList.add('cur'); act.scrollIntoView({block:'nearest'});}
  // preload neighbours so paging feels instant
  [cur+1,cur-1].forEach(k=>{ if(S[k]) new Image().src='data:image/webp;base64,'+S[k].img; });
  location.hash=s.n;
}

/* ---------- search ---------- */
$('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  const box=$('results');
  if(q.length<2){box.classList.remove('show');box.innerHTML='';return;}
  const hits=S.map((s,i)=>({s,i})).filter(({s})=>
    s.t.toLowerCase().includes(q)||s.x.toLowerCase().includes(q)).slice(0,80);
  box.innerHTML=`<h2>${hits.length} slide(s) matching “${esc(q)}” — esc to close</h2>`+
    hits.map(({s,i})=>{
      const k=s.x.toLowerCase().indexOf(q);
      const snip=k<0?s.x.slice(0,150):s.x.slice(Math.max(0,k-60),k+110);
      return `<button class="hit" data-i="${i}"><div class="hn">${String(s.n).padStart(3,'0')} · ${esc(CH[s.c].name)}</div>
        <div class="ht">${esc(s.t)}</div><div class="hx">…${esc(snip)}…</div></button>`;
    }).join('');
  box.classList.add('show');
  box.querySelectorAll('.hit').forEach(b=>b.onclick=()=>{go(+b.dataset.i);close();});
});
function close(){$('results').classList.remove('show');$('q').value='';}

/* ---------- controls ---------- */
$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>go(cur+1);
$('menu').onclick=()=>app.classList.toggle('collapsed');
$('inv').onclick=e=>{app.classList.toggle('invert');e.target.classList.toggle('on',app.classList.contains('invert'));};
$('pres').onclick=()=>{app.classList.toggle('present');
  if(app.classList.contains('present')&&document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});};

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape'){close();e.target.blur();} return; }
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='j'||k===' '){e.preventDefault();go(cur+1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='k'){e.preventDefault();go(cur-1);}
  else if(k==='Home'){go(0);} else if(k==='End'){go(S.length-1);}
  else if(k==='/'){e.preventDefault();$('q').focus();}
  else if(k==='f'){$('pres').click();}
  else if(k==='m'){$('menu').click();}
  else if(k==='i'){$('inv').click();}
  else if(k==='Escape'){close(); if(app.classList.contains('present'))$('pres').click();}
});

/* swipe on touch devices */
let sx=null;
$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{
  if(sx===null)return; const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>45) go(cur+(dx<0?1:-1)); sx=null;},{passive:true});

$('total').textContent=S.length;
go(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
</script>
</body>
</html>
