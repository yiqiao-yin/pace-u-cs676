name: Tests

# Runs on every push and pull request. Both starter kits are built to work with
# no API key, so this needs no secrets and costs nothing to run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-1:
    name: Project 1 — credibility scorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deliverable/project_1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: deliverable/project_1

      - name: Contract tests
        run: python test_credibility.py
        working-directory: deliverable/project_1

      # The evaluator is the offline promise made to students in the README:
      # it must run and report numbers without an API key.
      - name: Evaluation harness (rules only, no API key)
        run: python evaluate.py
        working-directory: deliverable/project_1

      # Regression guard. `--llm` without a key used to print a full table of
      # rules-only numbers under a heading saying the LLM layer was on, because
      # evaluate.py never loaded .env and llm_opinion() returns None silently.
      # Students compared the two runs, saw identical figures, and concluded
      # their key was broken. CI has no key, so this is the exact broken state:
      # it must now exit non-zero and say why, not score 24 URLs and lie.
      - name: '--llm without a key must fail loudly, not silently'
        run: |
          set -e
          if python evaluate.py --llm > /tmp/llm.txt 2>&1; then
            echo "::error::evaluate.py --llm succeeded with no API key — it has gone silent again"
            cat /tmp/llm.txt
            exit 1
          fi
          grep -q "ANTHROPIC_API_KEY is not set" /tmp/llm.txt || {
            echo "::error::it failed, but not with the explanation students need"
            cat /tmp/llm.txt; exit 1; }
          grep -q "Mean absolute error" /tmp/llm.txt && {
            echo "::error::it printed a results table anyway — those numbers would be rules-only"
            cat /tmp/llm.txt; exit 1; }
          echo "  --llm with no key exits loudly and prints no misleading numbers"
        working-directory: deliverable/project_1

  project-2:
    name: Project 2 — PersonaForge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv publishes no floating major tag past v6, so this is
      # pinned to an exact release. Bump it deliberately.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install the package and its dev group
        run: uv sync
        working-directory: deliverable/project_2

      - name: Test suite
        run: uv run pytest -q
        working-directory: deliverable/project_2

      # --offline is the other promise: the whole app runs with no key. Drive it
      # end to end and require that it actually created personas and a
      # conversation, rather than merely exiting zero.
      - name: Offline end-to-end run
        working-directory: deliverable/project_2
        run: |
          printf 'create a persona nurse\ncreate a persona doctor\nhave them talk about the schedule\n/quit\n' \
            | uv run main.py --offline > /tmp/session.txt 2>&1
          grep -q "Created" /tmp/session.txt || { echo "::error::no persona was created"; cat /tmp/session.txt; exit 1; }
          grep -q "turns between" /tmp/session.txt || { echo "::error::no conversation ran"; cat /tmp/session.txt; exit 1; }
          test -f temp/conversation.md || { echo "::error::transcript was not written"; exit 1; }
          echo "offline session produced personas, a conversation, and a transcript"

  homework:
    name: Homework — stubs intact, no leaked solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install numpy

      # The answer keys are gitignored and live only in the private mirror, so
      # CI cannot regenerate the student scripts. What it CAN do is guard the
      # thing that would actually hurt: a solution accidentally committed into a
      # student-facing file, or a stub deleted so the exercise stops being one.
      - name: Every exercise must still stop at a NotImplementedError
        run: |
          set -e
          cd notebooks/homework
          # Exact stub counts, not "at least one". A file can have several blanks
          # (01 and 02 have two, 05 has three), so checking merely that SOME stub
          # survives lets a partial solution leak through unnoticed. If you
          # deliberately change how many blanks an exercise has, update this map
          # in the same commit — that is the point of it being explicit.
          declare -A EXPECTED=( [01_lr.py]=2 [02_logreg.py]=2 [03_cv.py]=2 [04_tree.py]=1 [05_kmeans.py]=3 )
          fail=0
          # Glob 0[1-5] rather than 0*, because 00_uv_tutorial.py is not an
          # exercise: it has no blanks and is SUPPOSED to run to completion,
          # which every assertion in this loop would flag. It gets its own step
          # below. Keep this glob narrow when adding exercises.
          for f in 0[1-5]_*.py; do
            python -c "import ast,sys; ast.parse(open('$f').read())" || { echo "::error file=$f::does not parse"; fail=1; continue; }
            want=${EXPECTED[$f]:-}
            if [ -z "$want" ]; then
              echo "::error file=$f::not in the expected-stub map; add it"; fail=1; continue
            fi
            got=$(grep -c "raise NotImplementedError" "$f" || true)
            if [ "$got" -ne "$want" ]; then
              echo "::error file=$f::expected $want NotImplementedError stub(s), found $got — has a solution leaked in?"; fail=1; continue
            fi
            if python "$f" > /tmp/out.txt 2>&1; then
              echo "::error file=$f::ran to completion; it should have stopped at a stub"; cat /tmp/out.txt; fail=1; continue
            fi
            grep -q "NotImplementedError" /tmp/out.txt || { echo "::error file=$f::failed for the wrong reason"; cat /tmp/out.txt; fail=1; }
            echo "  $f has its $want stub(s) and stops at one, as intended"
          done
          exit $fail

      - name: The uv tutorial must run cleanly
        run: |
          # 00_uv_tutorial.py is the opposite of the exercises: it is the one
          # script in this folder that must run start to finish, since students
          # meet it before they have written any code. It uses only the standard
          # library, so plain python is a fair test of it.
          set -e
          cd notebooks/homework
          python 00_uv_tutorial.py > /tmp/tut.txt 2>&1 || {
            echo "::error file=00_uv_tutorial.py::the tutorial failed to run"
            cat /tmp/tut.txt; exit 1; }
          grep -q "WHAT TO REMEMBER" /tmp/tut.txt || {
            echo "::error file=00_uv_tutorial.py::ran but did not print its summary"
            cat /tmp/tut.txt; exit 1; }
          python 00_uv_tutorial.py --name Ada --times 2 | grep -q "Hello, Ada" || {
            echo "::error file=00_uv_tutorial.py::command-line flags are broken"; exit 1; }
          echo "  00_uv_tutorial.py runs clean, and its flags work"

      - name: No answer key may be committed to the public repo
        run: |
          # This pattern is deliberately narrow, and must stay that way.
          #
          # `notebooks/homework/solutions/*_solution.py` is the RELEASE path:
          # those files are published on purpose, one per homework, after each
          # deadline has passed. They must NOT match here or no release can ever
          # land. Do not "tidy" this to a looser pattern like `ans` or
          # `solution` — the first blocks every release, the second blocks the
          # whole scheme. What is banned is the private key: the `answer/`
          # directory and the `_ans.py` suffix. Nothing else.
          if git ls-files | grep -E "homework/answer/|_ans\.py"; then
            echo "::error::an answer key is tracked in the public repository"
            exit 1
          fi
          echo "no answer keys tracked"

      - name: Released solutions — report which, and check they still run
        run: |
          # Releasing is a manual `git add -f`, so this step does not judge WHICH
          # solutions are out — only the instructor knows which deadlines have
          # passed. It prints the current release state, so a mistaken release
          # shows up in the log rather than silently, and it runs whatever is
          # released, so a published solution can never be a broken one.
          set -e
          released=$(git ls-files "notebooks/homework/solutions/")
          if [ -z "$released" ]; then
            echo "no solutions released yet"
            exit 0
          fi
          echo "released solutions:"
          echo "$released" | sed 's/^/  /'

          # Only generated solutions belong in that directory.
          if stray=$(echo "$released" | grep -v "_solution\.py$"); then
            echo "::error::unexpected file(s) in notebooks/homework/solutions/:"
            echo "$stray"
            exit 1
          fi

          for f in $released; do
            if ! python "$f" > /tmp/sol.txt 2>&1; then
              echo "::error file=$f::a released solution failed to run"
              cat /tmp/sol.txt
              exit 1
            fi
            echo "  $f runs clean"
          done
