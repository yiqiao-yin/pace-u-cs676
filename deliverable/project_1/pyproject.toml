[project]
name = "cs676-project-1"
version = "0.1.0"
description = "CS676 Project 1 — credibility-scored research chatbot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # >=0.70 required for the `output_config` structured-output parameter
    # that credibility.py uses; 0.69 predates it and fails at runtime.
    "anthropic>=0.120.0",
    "streamlit>=1.50.0",
    "python-dotenv>=1.1.1",
    "google-search-results>=2.4.2",
    "langfuse>=3.6.1",
]
